[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pt13528"
dynamic = ["version"]
description = "A Python library for proficiency testing statistics according to ISO 13528"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.txt", "COPYING", "COPYING.LESSER", "NOTICE.md"]
authors = [
  { name = "Murat Sert" },
  { name = "Mustafa Kemal Yağan" },
  { name = "Ali Aydın" },
  { name = "Matin Heidarizadeh" },
  { name = "Eyüphan Tilki" },
  { name = "Ahmet Enes Selek" },
  { name = "Aliye Mete Sert" },
]
keywords = ["proficiency testing", "ISO 13528", "interlaboratory comparison", "robust statistics", "metrology"]

[project.urls]
Repository = "https://github.com/kanunimurat/pt13528"
Issues = "https://github.com/kanunimurat/pt13528/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.version]
path = "src/pt13528/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pt13528"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
